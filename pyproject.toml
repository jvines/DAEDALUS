[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daedalus"
version = "0.0.1.dev0"
description = "Trans-dimensional and standard nested sampling via Mixtures of Mutually Singular distributions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jose Vines", email = "jose.vines.l@gmail.com" },
]
keywords = [
    "nested sampling",
    "bayesian inference",
    "model selection",
    "trans-dimensional",
    "MoMS",
    "variable selection",
    "MCMC",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # NumPy 2.0 is the floor the test suite actually verifies: the frozen
    # reproducibility fixtures in tests/test_progress_callback.py pin
    # bit-identical output, and NumPy's reduction order changed between
    # majors, so results differ in the last ulp on 1.x.
    "numpy>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
progress = ["tqdm>=4.65"]
plotting = ["matplotlib>=3.7", "corner>=2.2"]
# Data-bearing benchmarks: the JZS diabetes design matrix comes from
# scikit-learn, and the light-curve/spectrum benchmarks use astropy.
benchmarks = ["scikit-learn>=1.3", "astropy>=5.3"]
# Physical (Mandel-Agol) transit shapes in the WASP-47 benchmark.
transit = ["batman-package>=2.4"]
# Everything the paper-reproduction scripts in scripts/ need on top of the
# above: archive queries (VizieR, MAST) and JIT-compiled likelihood kernels.
reproduce = [
    "daedalus[benchmarks,transit,fast,plotting]",
    "astroquery>=0.4.6",
    "lightkurve>=2.4",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "black>=23.10",
    "isort>=5.12",
    "ruff>=0.1",
    "matplotlib>=3.7",
    "corner>=2.2",
]
all = [
    "daedalus[fast,progress,plotting,benchmarks,transit,reproduce]",
]

[project.urls]
Homepage = "https://github.com/jvines/DAEDALUS"
Issues = "https://github.com/jvines/DAEDALUS/issues"

[tool.hatch.build.targets.wheel]
packages = ["daedalus"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numba.*", "scipy.*", "tqdm.*", "matplotlib.*", "corner.*", "sklearn.*", "astropy.*", "batman.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks benchmark tests against analytical/reference results",
]
